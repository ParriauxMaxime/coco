<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
<clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="12"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="riso" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="11"/>
  <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.86  2.4 0 0 0 -1.25"/>
</filter>
<filter id="risoHeavy" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5"/>
  <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.86  3.2 0 0 0 -1.6"/>
</filter>
<filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.035 0.5" numOctaves="3" seed="3" result="n"/>
  <feDiffuseLighting in="n" surfaceScale="1.6" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="60"/></feDiffuseLighting>
  <feColorMatrix in="l" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.25  -0.9 0 0 0 0.9"/>
</filter>
<filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="-6" dy="-7" result="o1"/>
  <feComposite in="SourceAlpha" in2="o1" operator="out" result="hiEdge"/>
  <feFlood flood-color="#fff" flood-opacity="0.6"/><feComposite in2="hiEdge" operator="in" result="hi"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="6" dy="8" result="o2"/>
  <feComposite in="SourceAlpha" in2="o2" operator="out" result="shEdge"/>
  <feFlood flood-color="#3a2f1a" flood-opacity="0.4"/><feComposite in2="shEdge" operator="in" result="sh"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dx="6" dy="12"/>
  <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.35 0"/>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/><feMergeNode in="hi"/><feMergeNode in="sh"/></feMerge>
</filter>
<filter id="deboss" x="-20%" y="-20%" width="140%" height="140%">
  <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
  <feGaussianBlur in="inv" stdDeviation="9"/><feOffset dx="8" dy="11" result="s"/>
  <feFlood flood-color="#4a3c20" flood-opacity="0.55"/><feComposite in2="s" operator="in"/>
  <feComposite in2="SourceAlpha" operator="in" result="inner"/>
  <feGaussianBlur in="inv" stdDeviation="4"/><feOffset dx="-4" dy="-5" result="h"/>
  <feFlood flood-color="#fff" flood-opacity="0.7"/><feComposite in2="h" operator="in"/>
  <feComposite in2="SourceAlpha" operator="in" result="innerHi"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/><feMergeNode in="innerHi"/></feMerge>
</filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
  <circle cx="11" cy="11" r="7.5" fill="#2e2ca8"/>
</pattern>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="780">
  <stop offset="0.15" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
</linearGradient>
<mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
  <rect width="1024" height="1024" fill="url(#fade)"/>
</mask>

<filter id="risoFine" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="1" seed="11"/>
  <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.86  2 0 0 0 -1.2"/>
</filter>
<filter id="debossDeep" x="-20%" y="-20%" width="140%" height="140%">
  <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
  <feGaussianBlur in="inv" stdDeviation="12"/><feOffset dx="10" dy="14" result="s"/>
  <feFlood flood-color="#3a2d12" flood-opacity="0.75"/><feComposite in2="s" operator="in"/>
  <feComposite in2="SourceAlpha" operator="in" result="inner"/>
  <feGaussianBlur in="inv" stdDeviation="4"/><feOffset dx="-5" dy="-6" result="h"/>
  <feFlood flood-color="#fff" flood-opacity="0.85"/><feComposite in2="h" operator="in"/>
  <feComposite in2="SourceAlpha" operator="in" result="innerHi"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/><feMergeNode in="innerHi"/></feMerge>
</filter>
</defs><rect x="100" y="100" width="824" height="824" rx="185" fill="#f3ecdc" filter="url(#drop)"/><g clip-path="url(#clip)"><g transform="translate(0 0.0)" style="mix-blend-mode:multiply" opacity="0.9"><g transform="translate(512 512) scale(0.84) translate(-496 -512)"><path d="M630.7 320.5 A250 250 0 1 0 686.5 637" fill="none" stroke="#7b7bf5" stroke-width="140" stroke-linecap="round"/></g></g><g transform="translate(0.0 0.0)" style="mix-blend-mode:multiply"><g transform="translate(512 512) scale(0.84) translate(-496 -512)"><path d="M630.7 320.5 A250 250 0 1 0 686.5 637" fill="none" stroke="#7b7bf5" stroke-width="140" stroke-linecap="round"/><path fill="#f2b84b" d="M640 372 C770 360 852 455 842 600 C838 652 816 684 790 692 C794 622 762 574 684 566 C672 500 660 430 640 372 Z"/><circle cx="560" cy="440" r="54" fill="#1c1f29"/></g></g><rect x="100" y="100" width="824" height="824" filter="url(#riso)"/></g><rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="2"/></svg>